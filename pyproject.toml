[project]
name = "logdetective"
version = "4.10.2"
description = "Analyze logs with a template miner and an LLM to discover errors and suggest solutions."
authors = [
    { name="Jiri Podivin", email="jpodivin@gmail.com" }
]
license = "Apache-2.0"
readme = "README.md"
license-files = [
    "LICENSE"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Internet :: Log Analysis"
]
keywords = [
    "logs",
    "AI",
    "drain3",
    "LLM",
]
dependencies = [
    "llama-cpp-python >0.2.56,!=0.2.86,<1.0.0",
    "drain3-improved >=0.10.0",
    "huggingface-hub >=1.0.0,<2.0.0",
    "numpy >=1.26.0",
    "pydantic >=2.8.2,<3.0.0",
    "pyyaml >=6.0.1,<7.0.0",
    "aiohttp >=3.7.4,<4.0.0",  # latest version in el8
    # Protection against supply chain compromise https://docs.litellm.ai/blog/security-update-march-2026
    "litellm !=1.82.7,!=1.82.8",
    "beeai-framework >=0.1.81",
]
requires-python = ">=3.11,<3.14"

[project.urls]
homepage = "https://github.com/fedora-copr/logdetective"
issues = "https://github.com/fedora-copr/logdetective/issues"

[tool.poetry]
include = [
    "logdetective/drain3.ini",
    "logdetective/server/templates/gitlab_comment.md.j2",
    "logdetective/prompts.yml",
    "logdetective.1.asciidoc",
    "logdetective/prompts/agent_start_prompt.j2",
    "logdetective/prompts/message_template.j2",
    "logdetective/prompts/system_prompt.j2",
]
packages = [
    { include = "logdetective" }
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.1,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "tenacity>=9.1.0,<9.2.0",
    "sentry-sdk[fastapi]>=2.17.0,<3.0.0",
    "koji>=1.35.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "python-gitlab>=4.4.0",
    "httpx>=0.28.1,<1.0.0",
    "starlette<2.0.0",
    "uvicorn>=0.44.0",
    "gunicorn>=25.3.0",
    "fastembed>=0.8.0",
    "pgvector>=0.4.2",
    "google-cloud-aiplatform>=1.158.0",
]
server-testing = [
    "fastapi>=0.111.1,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "tenacity>=9.1.0,<9.2.0",
    "sentry-sdk[fastapi]>=2.17.0,<3.0.0",
    "koji>=1.35.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "python-gitlab>=4.4.0",
    "httpx>=0.28.1,<1.0.0",
    "starlette<2.0.0",
    "uvicorn>=0.44.0",
    "gunicorn>=25.3.0",
    "fastembed>=0.8.0",
    "pgvector>=0.4.2",
    "google-cloud-aiplatform>=1.158.0",
    "responses",
]
testing = [
    "pytest",
    "pytest-asyncio",
    "aioresponses",
    "pytest-cov",
    "asciidoc>=10.2.1,<11.0.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
logdetective = 'logdetective.logdetective:main'

[tool.pylint]
disable = [
    "inconsistent-return-statements",
    "missing-module-docstring",
    "too-few-public-methods",
    "unspecified-encoding",
]
extension-pkg-allow-list = ["socket"]

[tool.pylint.typecheck]
# TODO: Pylint fails in CI on loading `AddressFamily` enum from socket,
# other approaches have failed to resolve the issue.
# Remove when the https://github.com/pylint-dev/pylint/issues/9850 is fixed.
# Tell pylint to ignore 'no-member' errors for these specific attributes
# because it cannot reliably find them in the C-extension statically.
generated-members = ["socket.AddressFamily", "AddressFamily"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.djlint]
profile="jinja"
extension=".j2"
